        <style>
            :root {
                --background: black;
                --strong-borders: red;
                --weak-borders: white;
                --text: white;
                --unknown: green; /* make it obviously wrong until I can see it */
            }
            h1 {
                text-align: center;
            }
            div {
                margin: 3px;
                text-align: center;
            }

            .dictionary {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
                flex-direction: column;
            }

            .array {
                border: 5px solid var(--unknown);
            }

            /* english */
            em, .simple-key-default {
                font-style: italic;
            }

            /* tlhingan */
            strong, .string-default {
                font-weight: bolder;
            }

            .complex-dictionary-entry {
                border: 1px solid var(--strong-borders);
            }

            .complex-entry-header {
                text-decoration: underline;
            }

            .complex-entry-body {
                margin: 0px;
            }

            body {
                background: var(--background);
                color: var(--text);
            }

            .simple-separator::after {
                content: " "; /* emspace */
            }

            .horizontal {
                flex-direction: row;
            }

            /* For POV tables */
            table {
                border-collapse: collapse;
                margin:auto;
            }
            td {
                border: 1px solid var(--weak-borders);
                padding: 3px;
                text-align: center;
            }
            tr:first-child td {
                border-top: 0;
            }
            tr td:first-child {
                border-left: 0;
            }
            tr:last-child td {
                border-bottom: 0;
            }
            tr td:last-child {
                border-right: 0;
            }
        </style>
    </head>

                            }, {

                            }, "1️⃣-Daj", {

            "Names of letters": {
                "glottal stop": "qaghwI'",
                "the consonant &lt;consonant&gt;": "-ay",
                "the vowel &lt;vowel&gt;": "'&lt;vowel&gt;t",
            },
        }

        function applyEntryToObject(func) {
            return dict => Object.entries(dict).reduce(func, {})
        }

        function cleanLevelsEntry(filtered, [key, value]) {
            if (typeof(value) === "string" && value.startsWith('1️⃣')) {
                filtered[key] = value.substring('1️⃣'.length);
            } else {
                filtered[key] = value;
            }
            return filtered;
        }
        function cleanLevelsString(value) {
            if (value.startsWith('1️⃣')) {
                return value.substring('1️⃣'.length);
            }
            return value;
        }

        function levelFilterEntry(filtered, [key, value])
        {
            if (typeof(value) !== "string" || key === ListBoy.classListAdd) {
                filtered[key] = value;
            } else if (value.startsWith('1️⃣')) {
                filtered[key] = value; //value.substring('1️⃣'.length); // if it's in a dictionary, you don't need to remove the value, because the filter string will remove it.
            }
            return filtered;
        }
        function levelFilterString(value) {
            if (value.startsWith('1️⃣')) {
                return value.substring('1️⃣'.length);
            }
            return "";
        }

        ListBoy.RenderTo(data, "main", { object: applyEntryToObject(cleanLevelsEntry), string: cleanLevelsString});
        // ListBoy.RenderTo(data, "main");

        let povLegend = new POV(

        ListBoy.RenderTo(povLegend, "pov");
